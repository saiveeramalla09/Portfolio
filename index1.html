<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - My Portfolio</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

     
    <div class="login-box" >
         <div class="login-card" >
          <div class="login-section" >
                <h2> LOGIN DETAILS </h2>

                <form id="loginForm">

                  <input  id="username" class="login" type="text" placeholder="Enter your id">
                  <br>
                  <br>
                  <input id="password"class="login" type="password" placeholder="Enter password">
                  <br>
                  <br>
                  <button style="align-self: center;"  class="sub-but" >  Submit </button>

                </form>
            </div>
         </div>
        </div>
      </div>

      

  <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) 
        {
            // Prevent the page from reloading/breaking
            event.preventDefault(); 
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            // Set your desired login rules here
            if (username === "admin" && password === "12345") {
                // Redirect to your portfolio page
                window.location.href = "index3.html"; 
            } else {
                alert("Incorrect ID or Password! Try admin and 12345.");
            }
        });
  </script>



</body>
</html>
